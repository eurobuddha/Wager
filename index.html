<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Openly</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="mds.js"></script>
    <script type="text/javascript" src="js/contract.js"></script>
    <script type="text/javascript" src="js/chainmail.js"></script>
    <script type="text/javascript" src="js/db.js"></script>
    <script type="text/javascript" src="js/identity.js"></script>
    <script type="text/javascript" src="js/state.js"></script>
    <script type="text/javascript" src="js/txn.js"></script>
    <script type="text/javascript" src="js/app.js"></script>
</head>
<body>

<!-- Top bar with inline nav -->
<div class="topbar">
    <div class="topbar__brand"><b>O</b>pen<b>l</b>y</div>
    <div class="topbar__nav">
        <button class="topnav__tab active" data-view="markets" onclick="showView('markets')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button class="topnav__tab" data-view="post" onclick="showView('post')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        </button>
        <button class="topnav__tab" data-view="mybets" onclick="showView('mybets')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
        </button>
        <button class="topnav__tab" data-view="log" onclick="showView('activity')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="topnav__tab" data-view="more" onclick="showView('more')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
        <button class="topnav__tab" id="desktopToggle" onclick="toggleDesktopMode()" title="Auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </button>
    </div>
    <div class="topbar__right">
        <div class="topbar__bal" id="balance">—</div>
        <div class="topbar__sub" id="blockHeight"></div>
    </div>
</div>

<!-- Persistent activity log -->
<div class="logpanel" id="logPanel">
    <div class="logpanel__title">Activity</div>
    <div id="logEntries"></div>
</div>

<!-- Toast container for urgent alerts -->
<div class="toast-container" id="toastContainer"></div>

<!-- Onboarding overlay -->
<div id="onboarding"></div>

<!-- Main content -->
<div class="main" id="mainContent">
    <div class="empty">Loading...</div>
</div>

</body>
</html>
